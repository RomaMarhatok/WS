version: "3.9"
services:
  backend:
    restart: always
    container_name: ws-backend
    build:
      context: .
      dockerfile: ./ws/Dockerfile
    environment:
      - HOST=postgres_db
    ports:
      - 5000:5000
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres
    restart: always
    container_name: postgres_db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=${DB:?err}
      - POSTGRES_USER=${USER:?err}
      - POSTGRES_PASSWORD=${PASSWORD:?err}