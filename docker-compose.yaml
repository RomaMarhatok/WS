name: WS_DOCKER
services:
  note-app:
    container_name: wsAPI
    build:
      context: .
      dockerfile: ws/Dockerfile
      target: dev
    volumes:
      - ./ws:/ws
      - ./migrations:/migrations
    ports:
      - 8888:8000
    environment:
      - POSTGRES_HOST=db
    env_file:
      - .env
    command: ["python", "ws/main.py"]
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: wsDB
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
    ports:
      - ${POSTGRES_PORT:?err}:5432
    env_file:
      - .env
    
volumes:
  pgdata: